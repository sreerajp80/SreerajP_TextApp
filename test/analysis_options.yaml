# Analyzer settings for tests only. Inherits everything from the project root.
#
# Tests import app code with `package:sreerajp_textapp/...`, but shared test helpers
# (e.g. `test/support/test_support.dart`) live outside `lib/`, so they have no
# package URI and must be imported relatively. That one rule is turned off here.
include: ../analysis_options.yaml

linter:
  rules:
    always_use_package_imports: false
