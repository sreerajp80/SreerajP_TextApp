# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.
#
# The rule set below follows the shared engineering standard
# (docs/guidelines/flutter_project_engineering_standard.md §16.1).
# `flutter analyze` must stay at zero issues — see CLAUDE.md §9.

include: package:flutter_lints/flutter.yaml

analyzer:
  # Vendored third-party packages are not our code. Do not analyze them.
  exclude:
    - third_party/**

linter:
  # Stricter rules added on top of `flutter_lints`. To silence one line use
  # `// ignore: name_of_lint`, or `// ignore_for_file: name_of_lint` for a file.
  rules:
    # Imports and structure
    always_use_package_imports: true
    # Logging — use the AppLogger service, never a bare print.
    avoid_print: true
    # Correctness / resource safety
    cancel_subscriptions: true
    close_sinks: true
    avoid_empty_else: true
    no_duplicate_case_values: true
    use_enums: true
    # Style
    # `avoid_redundant_argument_values` from the shared baseline is deliberately NOT
    # enabled. It flags 111 existing sites, many of them regex `caseSensitive: false`
    # flags in the parsers and explicit arguments in the crypto and secure-wipe code,
    # where writing the value out is the clearer and safer choice.
    prefer_single_quotes: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_final_fields: true
    prefer_final_locals: true
    prefer_is_empty: true
    unnecessary_brace_in_string_interps: true
    unnecessary_this: true
    noop_primitive_operations: true
    avoid_bool_literals_in_conditional_expressions: true
    # Flutter widget hygiene
    avoid_unnecessary_containers: true
    sized_box_for_whitespace: true
    use_key_in_widget_constructors: true
    sort_child_properties_last: true
    use_decorated_box: true
    use_full_hex_values_for_flutter_colors: true

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
